buildscript {
    ext {
        oktaProperties = new Properties()
        oktaPropertiesFile = new File(project.projectDir, "okta.properties")
        if (oktaPropertiesFile.exists()) {
            oktaProperties.load(oktaPropertiesFile.newReader())
            println("okta.properties loaded.")
        } else {
            println("okta.properties does not exist in the path and will be ignored.")
        }
    }
}

plugins {
    id("com.android.application")
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def googleServicesFile = new File(project.projectDir, "google-services.json")
def isGoogleServicesFileExists = googleServicesFile.exists()

// project version section
def projectVersion = rootProject.findProperty('versionParam') ?: '2.5.0'
def useArtifactory = rootProject.findProperty('useArtifactory')?.toBoolean() ?: (rootProject.name != 'mobile-messenger-android-sdk')
def useMavenCentral = rootProject.findProperty('useMavenCentral')?.toBoolean() ?: false
def injectedVersionCode = project.findProperty("versionCode")?.toString()?.toInteger()
// project version section

if (isGoogleServicesFileExists) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
    println("Google Services plugin enabled.")
    println("Crashlytics plugin enabled.")
}

android {
    namespace = "com.genesys.cloud.messenger.sample"
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = "com.genesys.cloud.messenger.sample"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode = injectedVersionCode ?: 1
        versionName = projectVersion

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // OKTA
        buildConfigField "String", "OKTA_DOMAIN", '"' + oktaProperties["oktaDomain"] + '"'
        buildConfigField "String", "CLIENT_ID", '"' + oktaProperties["clientId"] + '"'
        buildConfigField "String", "SIGN_IN_REDIRECT_URI", '"' + oktaProperties["signInRedirectUri"] + '"'
        buildConfigField "String", "SIGN_OUT_REDIRECT_URI", '"' + oktaProperties["signOutRedirectUri"] + '"'
        buildConfigField "String", "OKTA_STATE", '"' + oktaProperties["oktaState"] + '"'
        buildConfigField "String", "SCOPES", '"' + oktaProperties["scopes"] + '"'
        buildConfigField "String", 'CODE_CHALLENGE', '"' + oktaProperties['codeChallenge'] + '"'
        buildConfigField "String", 'CODE_CHALLENGE_METHOD', '"' + oktaProperties['codeChallengeMethod'] + '"'
        buildConfigField "String", 'CODE_VERIFIER', '"' + oktaProperties['codeVerifier'] + '"'
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles (
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    viewBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }
    lint {
        checkReleaseBuilds = true
    }
    bundle {
        language {
            language {
                enableSplit = false
            }
            density {
                enableSplit = false
            }
            abi {
                enableSplit = false
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17"))
    }
}

dependencies {

    //region Genesys
    if (useArtifactory) {
        def groupId = useMavenCentral ? "cloud.genesys" : "com.genesys.cloud"
        implementation("${groupId}:core:${projectVersion}")
        implementation("${groupId}:chatintegration:${projectVersion}")
        implementation("${groupId}:ui:${projectVersion}")
    } else {
        // Local development: use source code from SDK modules
        implementation project(':core')
        implementation project(':chatintegration')
        implementation project(':ui')
    }

    //region android
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material.base
    implementation libs.constraintlayout.app
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    //endregion

    //region Compose
    implementation platform('androidx.compose:compose-bom:2025.11.01') // latest version with minSdk 21 support
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    //endregion

    //region lifecycle
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    //endregion

    //region navigation
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    //endregion

    //region Gson
    implementation libs.gson.sample
    implementation libs.androidx.legacy.support.v4
    //endregion

    //region Firebase
    if (isGoogleServicesFileExists) {
        implementation libs.firebase.crashlytics.ktx
        implementation libs.firebase.analytics.ktx
    }
    implementation libs.firebase.messaging
    //endregion

    //region Tests
    testImplementation libs.junit.common
    testImplementation libs.mockk.core
    androidTestImplementation libs.test.junit.sample
    androidTestImplementation libs.espresso.sample
    //endregion
}
