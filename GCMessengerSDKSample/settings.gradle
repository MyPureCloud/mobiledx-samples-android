pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        if (!providers.gradleProperty('useMavenCentral').getOrElse('false').toBoolean()) {
            maven { url "https://genesysdx.jfrog.io/artifactory/genesys-cloud-android.prod/" }
        }
    }
    // Standalone sample-app build: reuse the SDK's version catalog.
    // (When built as part of the root project, the catalog is auto-detected.)
    versionCatalogs {
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
rootProject.name = "GCMessengerSDKSample"
include ':app'
